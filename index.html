<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MATRIX LAB PRO — Algebra &amp; Control Theory</title>
  <style>
    :root {
      --bg-dark: #080D18;
      --bg-grad-top: #14233B;
      --card-dark: #111A2B;
      --card-elevated: #17233A;
      --border-col: #24334D;
      --cyan: #54E5E5;
      --purple: #B69AFF;
      --amber: #FFD166;
      --emerald: #70E1A1;
      --danger: #F87171;
      --text-white: #EDF4FF;
      --text-dim: #9BABC5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 12px);
      background: linear-gradient(180deg, var(--bg-grad-top) 0%, var(--bg-dark) 45%, #070B14 100%);
      background-attachment: fixed;
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    .app-container { max-width: 1220px; margin: 0 auto; padding: 12px 14px 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; margin: 0; }
    .brand-sub { font-size: 10px; color: var(--cyan); font-weight: 700; letter-spacing: 1.1px; margin-top: 2px; }
    .history-btn {
      background: var(--card-dark); color: var(--cyan); border: 1px solid var(--border-col);
      border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .main-tabs {
      display: flex; gap: 6px; background: var(--card-dark); border: 1px solid var(--border-col);
      border-radius: 14px; padding: 4px; margin-bottom: 14px;
    }
    .cat-pill {
      flex: 1; height: 40px; border-radius: 10px; border: 1px solid transparent;
      background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .cat-pill.active-cyan { background: rgba(84, 229, 229, 0.2); border-color: var(--cyan); color: var(--text-white); }
    .cat-pill.active-purple { background: rgba(182, 154, 255, 0.22); border-color: var(--purple); color: var(--text-white); }

    .workspace { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    @media (min-width: 920px) { .workspace { grid-template-columns: 1.05fr 0.95fr; } }

    .panel-card {
      background: rgba(17, 26, 43, 0.82); border: 1px solid #1F2D46;
      border-radius: 16px; padding: 12px; margin-bottom: 12px;
    }
    .matrix-tabs {
      display: flex; gap: 6px; background: var(--card-dark); padding: 5px;
      border-radius: 14px; border: 1px solid var(--border-col); margin-bottom: 10px;
    }
    .mat-chip {
      flex: 1; padding: 9px 4px; border-radius: 10px; border: 1px solid transparent;
      background: transparent; color: var(--text-dim); font-weight: 700; font-size: 12.5px; cursor: pointer; text-align: center;
    }
    .mat-chip.sel-A { background: rgba(84, 229, 229, 0.2); border-color: var(--cyan); color: var(--cyan); }
    .mat-chip.sel-B { background: rgba(182, 154, 255, 0.2); border-color: var(--purple); color: var(--purple); }
    .mat-chip.sel-C { background: rgba(255, 209, 102, 0.2); border-color: var(--amber); color: var(--amber); }

    .dim-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .dim-card {
      flex: 1; min-width: 145px; background: var(--card-dark); border: 1px solid var(--border-col);
      border-radius: 12px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .dim-label { font-size: 12px; color: var(--text-dim); font-weight: 600; }
    .counter-wrap { display: flex; align-items: center; gap: 8px; }
    .cnt-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(84,229,229,0.5);
      background: #1E293B; color: var(--text-white); font-size: 17px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .cnt-btn:disabled { opacity: 0.3; cursor: default; border-color: var(--border-col); background: transparent; }
    .cnt-val { font-size: 15px; font-weight: 700; min-width: 22px; text-align: center; }

    .quick-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .q-chip {
      flex: 1; min-width: 64px; height: 34px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.2);
      background: #1E293B; color: var(--text-white); font-size: 11.5px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0 6px; white-space: nowrap;
    }
    .q-emerald { color: var(--emerald); border-color: rgba(112,225,161,0.35); background: rgba(112,225,161,0.12); }
    .q-cyan { color: var(--cyan); border-color: rgba(84,229,229,0.35); background: rgba(84,229,229,0.12); }
    .q-purple { color: var(--purple); border-color: rgba(182,154,255,0.35); background: rgba(182,154,255,0.12); }
    .q-amber { color: var(--amber); border-color: rgba(255,209,102,0.35); background: rgba(255,209,102,0.12); }
    .q-danger { color: var(--danger); border-color: rgba(248,113,113,0.35); background: #2A1621; flex: 0.55; min-width: 42px; }

    .matrix-scroll { width: 100%; overflow-x: auto; padding: 6px 0; display: flex; justify-content: center; }
    .matrix-bracket-wrap { display: inline-flex; align-items: stretch; gap: 4px; }
    .bracket-line { width: 4px; border-radius: 4px; background: var(--cyan); }
    .matrix-grid { display: flex; flex-direction: column; gap: 4px; }
    .matrix-grid-row { display: flex; gap: 4px; }
    .matrix-cell {
      width: 54px; height: 50px; border-radius: 8px; background: var(--card-dark);
      border: 1px solid var(--border-col); color: var(--text-white); font-size: 16px;
      font-weight: 600; text-align: center; outline: none;
    }
    .matrix-cell:focus { border-width: 1.5px; border-color: var(--cyan); background: #152238; }
    @media (max-width: 420px) { .matrix-cell { width: 46px; height: 46px; font-size: 16px; } }

    .sec-header { font-size: 11px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.4px; margin: 10px 0 6px; }
    .sec-header:first-child { margin-top: 0; }
    .btn-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .op-btn {
      flex: 1; min-width: 90px; height: 42px; border-radius: 11px; border: 1px solid rgba(84, 229, 229, 0.55);
      background: #192841; color: var(--cyan); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0 8px;
    }
    .op-btn.purple { background: #1F1B44; border-color: rgba(182, 154, 255, 0.55); color: #D2C4FF; }

    .scalar-bar { display: flex; align-items: center; gap: 8px; background: #0B1322; padding: 6px 10px; border-radius: 10px; margin-top: 8px; }
    .scalar-input {
      width: 68px; height: 36px; border-radius: 8px; background: var(--card-dark);
      border: 1px solid var(--border-col); color: var(--text-white); text-align: center; font-size: 16px; font-weight: 700;
    }
    .scalar-go { flex: 1; height: 36px; border-radius: 8px; border: none; background: #2563EB; color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer; }

    .result-card { background: var(--card-dark); border: 1.5px solid var(--emerald); border-radius: 16px; padding: 14px; margin-top: 8px; }
    .result-card.error { background: #331016; border-color: #EF4444; }
    .res-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .res-title { font-size: 13.5px; font-weight: 700; color: var(--emerald); }
    .result-card.error .res-title { color: #FCA5A5; }
    .res-actions { display: flex; gap: 6px; align-items: center; }
    .small-btn {
      border-radius: 7px; border: 1px solid #334155; background: #1E293B;
      color: var(--text-white); font-size: 11px; font-weight: 700; padding: 5px 9px; cursor: pointer;
    }
    .small-btn.active { background: rgba(84,229,229,0.22); border-color: var(--cyan); color: var(--cyan); }
    .res-text { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 13px; line-height: 1.5; color: var(--text-white); white-space: pre-wrap; overflow-x: auto; margin: 0 0 8px; }
    .res-grid-cell {
      width: 90px; min-width: 90px; max-width: 90px; height: 44px; padding: 4px 6px;
      border-radius: 8px; background: #0B1322; border: 1px solid #1F2E47;
      display: flex; align-items: center; justify-content: center;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 13px; font-weight: 600;
      color: var(--text-white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .frac-box { display: inline-flex; align-items: center; gap: 3px; }
    .frac-col { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; font-size: 10.5px; color: var(--cyan); font-weight: 800; }
    .frac-bar { width: 100%; height: 1.2px; background: var(--cyan); margin: 2px 0; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--card-dark); border: 1px solid var(--border-col); border-radius: 18px; width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border-col); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 17px; font-weight: 800; margin: 0; }
    .modal-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
    .modal-foot { padding: 10px 18px; border-top: 1px solid var(--border-col); display: flex; justify-content: flex-end; gap: 10px; }
    .pole-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .pole-input { width: 130px; padding: 8px 10px; border-radius: 8px; background: #0F172A; border: 1px solid var(--cyan); color: var(--text-white); font-size: 16px; font-weight: 600; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1E293B; border: 1px solid var(--cyan); color: var(--text-white); padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <div>
      <h1 class="brand-title">MATRIX LAB</h1>
      <div class="brand-sub">ALGEBRA &amp; THEORY OF CONTROL • PRO</div>
    </div>
    <button class="history-btn" id="btnOpenHistory">🕒 <span id="historyCount">0</span></button>
  </div>

  <div class="main-tabs">
    <button class="cat-pill active-cyan" id="tabMain0">⚡ Алгебра и Векторы</button>
    <button class="cat-pill" id="tabMain1">🎛 ТАУ, Спектр и f(A)</button>
  </div>

  <div class="workspace">
    <div>
      <div class="matrix-tabs">
        <button class="mat-chip sel-A" id="chipMatA">A (3×3)</button>
        <button class="mat-chip" id="chipMatB">B (3×3)</button>
        <button class="mat-chip" id="chipMatC">C (3×3)</button>
      </div>

      <div id="dimControlsContainer"></div>

      <div class="panel-card">
        <div class="matrix-scroll">
          <div class="matrix-bracket-wrap">
            <div class="bracket-line" id="bracketLeft"></div>
            <div class="matrix-grid" id="matrixGridInput"></div>
            <div class="bracket-line" id="bracketRight"></div>
          </div>
        </div>

        <div class="quick-row">
          <button class="q-chip" id="btnRandom">🎲 Рандом</button>
          <button class="q-chip q-emerald" id="btnIdentity">𝐈 Единич.</button>
          <button class="q-chip q-amber" id="btnCopyMat">📄 Копир.</button>
          <button class="q-chip q-cyan" id="btnPasteMat">📋 Встав.</button>
          <button class="q-chip q-danger" id="btnClearMat">✕</button>
        </div>

        <div class="quick-row" id="transferRow"></div>
      </div>

      <div id="resultCardContainer"></div>
    </div>

    <div class="panel-card" id="operationsPanel"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title" id="modalTitle">Диалог</h3>
      <button class="small-btn" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toastBox"></div>

<script src="math.js"></script>
<script src="app.js"></script>
</body>
</html>
