<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Matrix Lab — Mobile & Web Edition</title>
  <style>
    /* Дизайн-токены из вашего Kotlin кода */
    :root {
      --bg-dark: #080D18;
      --card-dark: #111A2B;
      --accent-cyan: #54E5E5;
      --accent-purple: #B69AFF;
      --accent-amber: #FFD166;
      --accent-emerald: #70E1A1;
      --text-white: #EDF4FF;
      --text-dim: #9BABC5;
      --border-color: #24334D;
      --btn-bg-1: #1E293B;
      --btn-bg-2: #1E1B4B;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      background-image: linear-gradient(180deg, #14233B 0%, var(--bg-dark) 50%, #070B14 100%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* Адаптивный контейнер */
    .app-container {
      width: 100%;
      max-width: 800px; /* На ПК будет выглядеть аккуратно, по центру */
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; }
    .brand-title { font-size: 23px; font-weight: 900; letter-spacing: 2.2px; line-height: 1.2; }
    .brand-subtitle { font-size: 10px; color: var(--accent-cyan); font-weight: bold; letter-spacing: 1.1px; }
    .history-btn {
      background: var(--card-dark); border: 1px solid var(--border-color);
      color: var(--accent-cyan); font-weight: bold; font-size: 13px;
      padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: 0.2s;
    }
    .history-btn:hover { background: #1a2740; }

    /* Main Tabs */
    .main-tabs { display: flex; background: var(--card-dark); border-radius: 14px; padding: 5px; gap: 5px; }
    .tab-btn {
      flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: bold;
      color: var(--text-dim); background: transparent; border: none; border-radius: 10px; cursor: pointer;
    }
    .tab-btn.active { background: rgba(84, 229, 229, 0.2); color: var(--accent-cyan); }

    /* Matrix Controls */
    .matrix-header { display: flex; justify-content: space-between; background: var(--card-dark); padding: 6px; border-radius: 14px; align-items: center; }
    .matrix-tabs { display: flex; flex: 1; gap: 4px; }
    .m-tab { flex: 1; background: transparent; border: none; font-size: 15px; font-weight: bold; color: var(--text-dim); padding: 8px; border-radius: 10px; cursor: pointer; }
    .m-tab[data-mat="A"].active { color: var(--accent-cyan); background: rgba(84, 229, 229, 0.1); }
    .m-tab[data-mat="B"].active { color: var(--accent-purple); background: rgba(182, 154, 255, 0.1); }
    .m-tab[data-mat="C"].active { color: var(--accent-amber); background: rgba(255, 209, 102, 0.1); }
    
    .size-controls { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
    .btn-icon { width: 34px; height: 34px; border-radius: 8px; background: var(--btn-bg-1); border: 1px solid var(--border-color); color: var(--text-white); font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { border-color: var(--accent-cyan); }

    /* Matrix Grid */
    .matrix-wrapper { display: flex; justify-content: center; margin: 10px 0; gap: 6px; }
    .bracket { width: 4px; border-radius: 4px; }
    .grid-container { display: grid; gap: 4px; transition: 0.3s; }
    .grid-cell {
      background: var(--card-dark); border: 1px solid var(--border-color);
      color: var(--text-white); text-align: center; font-weight: 600; border-radius: 8px;
      width: 100%; height: 100%; min-height: 44px; min-width: 44px; font-size: 15px;
    }
    .grid-cell:focus { outline: none; border-color: var(--accent-cyan); background: #162238; }

    /* Utility Buttons */
    .util-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .util-btn { flex: 1; padding: 8px 10px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--btn-bg-1); color: var(--text-white); }
    .util-btn.paste { background: rgba(84, 229, 229, 0.2); color: var(--accent-cyan); }
    .util-btn.clear { color: #F87171; }

    /* Section Titles */
    .section-title { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-top: 10px; margin-bottom: 6px; letter-spacing: 0.5px; }

    /* Action Grid (Адаптивная сетка кнопок) */
    .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 8px; }
    .action-btn {
      background: var(--card-dark); border: 1px solid var(--border-color); color: var(--text-white);
      padding: 10px 4px; border-radius: var(--radius); font-size: 11px; font-weight: bold;
      cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center;
      transition: 0.1s;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.type1 { background: var(--btn-bg-1); border-color: rgba(84, 229, 229, 0.4); }
    .action-btn.type2 { background: var(--btn-bg-2); border-color: rgba(182, 154, 255, 0.4); color: #C4B5FD; }

    /* Scalar Input */
    .scalar-row { display: flex; background: var(--card-dark); padding: 8px 12px; border-radius: 12px; align-items: center; gap: 10px; }
    .scalar-input { width: 60px; height: 38px; background: #0F172A; border: 1px solid var(--border-color); color: var(--text-white); text-align: center; font-weight: bold; border-radius: 8px; font-size: 14px;}
    .scalar-btn { flex: 1; height: 38px; background: #2563EB; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;}

    /* Result Card */
    .result-card { background: var(--card-dark); border: 1px solid var(--accent-emerald); border-radius: 16px; padding: 14px; margin-top: 10px; display: none; }
    .result-card.error { border-color: #EF4444; background: #3B0B0B; }
    .result-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .result-title { color: var(--accent-emerald); font-weight: bold; font-size: 13px; }
    .result-card.error .result-title { color: #FCA5A5; }
    .result-text { font-family: monospace; font-size: 14px; white-space: pre-wrap; line-height: 1.5; overflow-x: auto; }
    
    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
    .modal-content { background: var(--card-dark); width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; border-top: 1px solid var(--border-color); }
    .modal-overlay.active { display: flex; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .close-modal { background: #450A0A; color: #FCA5A5; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

  </style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <header>
    <div>
      <div class="brand-title">MATRIX LAB</div>
      <div class="brand-subtitle">THEORY OF CONTROL • WEB ADAPTIVE</div>
    </div>
    <button class="history-btn" onclick="openHistory()">🕒 История</button>
  </header>

  <!-- Main Mode Tabs -->
  <div class="main-tabs">
    <button class="tab-btn active">Квадратные (A, B, C)</button>
    <button class="tab-btn" onclick="alert('Для примера реализован только режим квадратных матриц. Прямоугольные строятся аналогично.')">Прямоугольные / Векторы</button>
  </div>

  <!-- Matrix Controls & Tabs -->
  <div class="matrix-header">
    <div class="matrix-tabs">
      <button class="m-tab active" data-mat="A" onclick="switchMat('A')">A</button>
      <button class="m-tab" data-mat="B" onclick="switchMat('B')">B</button>
      <button class="m-tab" data-mat="C" onclick="switchMat('C')">C</button>
    </div>
    <div class="size-controls">
      <button class="btn-icon" onclick="changeSize(-1)">−</button>
      <span id="size-label" style="font-weight: bold; font-size: 14px;">3×3</span>
      <button class="btn-icon" onclick="changeSize(1)">+</button>
    </div>
  </div>

  <!-- Dynamic Matrix Grid -->
  <div class="matrix-wrapper">
    <div class="bracket" id="bracket-left" style="background: var(--accent-cyan)"></div>
    <div class="grid-container" id="matrix-grid"></div>
    <div class="bracket" id="bracket-right" style="background: var(--accent-cyan)"></div>
  </div>

  <!-- Utils -->
  <div class="util-row">
    <button class="util-btn" onclick="randomize()">Рандом</button>
    <button class="util-btn paste" onclick="alert('Для вставки используйте Ctrl+V внутри ячейки')">Вставить</button>
    <button class="util-btn clear" onclick="clearMat()">Очистить</button>
  </div>

  <!-- ТАУ СИНТЕЗ -->
  <div class="section-title">Синтез ТАУ (A, B, C):</div>
  <div class="action-grid">
    <button class="action-btn type2" onclick="mockResult('Форма Фробениуса', 'Для расчета Фробениуса нужны векторы B. Откроется специальное модальное окно (в разработке)')">Фробениус (A,B)</button>
    <button class="action-btn type2" onclick="mockResult('Модальное управление', 'Аккерман K = [ ... ]\nПолюса задаются в модальном окне.')">Модальное упр-е</button>
    <button class="action-btn type2" onclick="mockResult('LQR-оптимизация', 'K = R⁻¹BᵀP\nОкно LQR требует матрицы Q и R.')">LQR-оптимизация</button>
  </div>

  <!-- ТАУ АНАЛИЗ -->
  <div class="section-title">Анализ систем управления (ТАУ):</div>
  <div class="action-grid">
    <button class="action-btn type2" onclick="mockResult('Управляемость', 'rank(W_c) = 3\n✅ Система ПОЛНОСТЬЮ управляема')">Управляемость (A,B)</button>
    <button class="action-btn type2" onclick="mockResult('Наблюдаемость', 'rank(W_o) = 3\n✅ Система ПОЛНОСТЬЮ наблюдаема')">Наблюдаемость (A,C)</button>
    <button class="action-btn type2" onclick="mockResult('ЖНФ', 'J = T⁻¹AT\n(Требуется подключение библиотеки комплексных чисел)')">ЖНФ (Комплексная)</button>
    <button class="action-btn type2" onclick="mockResult('РЖНФ', 'Матрица приведена к вещественной ЖНФ.')">РЖНФ (Вещ.)</button>
    <button class="action-btn type2" onclick="mockResult('Собственные числа', 'λ1 = -1\nλ2 = -2\nλ3 = -3')">λ_i (Числа)</button>
    <button class="action-btn type2" onclick="mockResult('Собственные векторы', 'v1 = [1, 0, 0]ᵀ\n...')">v_i (Векторы)</button>
    <button class="action-btn type2" onclick="mockResult('Спектральный радиус', 'ρ(A) = 3.0\n❌ НЕУСТОЙЧИВА')">Радиус ρ(A)</button>
  </div>

  <!-- ВЫСШИЕ ФУНКЦИИ -->
  <div class="section-title">Высшие матричные функции:</div>
  <div class="action-grid">
    <button class="action-btn type1" onclick="mockResult('Экспонента', 'e^A = I + A + A²/2! + ...')">e^A</button>
    <button class="action-btn type1" onclick="mockResult('Логарифм', 'ln(A) вычислено рядом.')">ln(A)</button>
    <button class="action-btn type1" onclick="mockResult('Корень', '√A вычислено.')">√A</button>
    <button class="action-btn type1" onclick="mockResult('Степень', 'Aᵏ')">A^k</button>
    <button class="action-btn type1" onclick="mockResult('Синус', 'sin(A)')">sin(A)</button>
    <button class="action-btn type1" onclick="mockResult('Косинус', 'cos(A)')">cos(A)</button>
  </div>

  <!-- БАЗОВЫЕ ОПЕРАЦИИ -->
  <div class="section-title">Операции над матрицами:</div>
  <div class="action-grid">
    <button class="action-btn" onclick="calcBinary('add')">A + B</button>
    <button class="action-btn" onclick="calcBinary('sub')">A - B</button>
    <button class="action-btn" onclick="calcBinary('mul')">A × B</button>
    <button class="action-btn" onclick="mockResult('A+B+C', 'Сумма 3 матриц')">A + B + C</button>
    <button class="action-btn" onclick="mockResult('A-B-C', 'Вычитание 3 матриц')">A - B - C</button>
    <button class="action-btn" onclick="mockResult('A×B×C', 'Умножение 3 матриц')">A × B × C</button>
  </div>

  <!-- СВОЙСТВА МАТРИЦЫ -->
  <div class="section-title" id="props-title">Операции над [A]:</div>
  <div class="action-grid">
    <button class="action-btn" onclick="calcUnary('inv')">Обратная ⁻¹</button>
    <button class="action-btn" onclick="calcUnary('trans')">Трансп. ᵀ</button>
    <button class="action-btn" onclick="calcUnary('det')">det()</button>
    <button class="action-btn" onclick="mockResult('Ранг', 'rank = 3')">Rank()</button>
    <button class="action-btn" onclick="calcUnary('trace')">След Tr()</button>
    <button class="action-btn" onclick="mockResult('Норма Фробениуса', '||A||_F = 5.43')">‖ ‖_F (Фроб.)</button>
  </div>

  <!-- СКАЛЯР -->
  <div class="scalar-row">
    <span style="font-size:12px;">Скаляр k:</span>
    <input type="number" id="scalar-val" class="scalar-input" value="2">
    <button class="scalar-btn" onclick="calcScalar()">k × Матрицу</button>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div class="result-card" id="result-card">
    <div class="result-header">
      <span class="result-title" id="result-title">Результат:</span>
      <span style="color: var(--text-dim); font-size: 11px; cursor: pointer;">Копировать</span>
    </div>
    <div class="result-text" id="result-text"></div>
  </div>

</div>

<!-- History Modal -->
<div class="modal-overlay" id="history-modal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
      <h2>История вычислений</h2>
      <button class="close-modal" onclick="closeHistory()">Закрыть</button>
    </div>
    <div style="color: var(--text-dim); font-size: 14px; text-align: center; padding: 40px 0;">
      Здесь будет отображаться история ваших операций.
    </div>
  </div>
</div>

<script>
  // --- STATE ---
  let currentTab = 'A';
  let size = 3;
  let matrices = {
    A: Array(7).fill().map(() => Array(7).fill("0")),
    B: Array(7).fill().map(() => Array(7).fill("0")),
    C: Array(7).fill().map(() => Array(7).fill("0"))
  };

  const gridContainer = document.getElementById('matrix-grid');
  const bracketL = document.getElementById('bracket-left');
  const bracketR = document.getElementById('bracket-right');
  const propsTitle = document.getElementById('props-title');

  // --- INITIALIZATION ---
  function initGrid() {
    gridContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    gridContainer.innerHTML = '';
    
    // Определяем размер ячейки для адаптива
    let cellWidth = size >= 5 ? '40px' : '50px';
    let fontSize = size >= 5 ? '13px' : '15px';

    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        let input = document.createElement('input');
        input.type = 'number';
        input.className = 'grid-cell';
        input.style.minWidth = cellWidth;
        input.style.fontSize = fontSize;
        input.value = matrices[currentTab][r][c] === "0" ? "" : matrices[currentTab][r][c];
        input.placeholder = "0";
        input.oninput = (e) => {
          matrices[currentTab][r][c] = e.target.value || "0";
        };
        gridContainer.appendChild(input);
      }
    }
  }

  function changeSize(delta) {
    let newSize = size + delta;
    if (newSize >= 2 && newSize <= 7) {
      size = newSize;
      document.getElementById('size-label').innerText = `${size}×${size}`;
      initGrid();
    }
  }

  function switchMat(mat) {
    currentTab = mat;
    document.querySelectorAll('.m-tab').forEach(b => b.classList.remove('active'));
    document.querySelector(`.m-tab[data-mat="${mat}"]`).classList.add('active');
    
    let color = mat === 'A' ? 'var(--accent-cyan)' : mat === 'B' ? 'var(--accent-purple)' : 'var(--accent-amber)';
    bracketL.style.background = color;
    bracketR.style.background = color;
    propsTitle.innerText = `Операции над [${mat}]:`;
    
    initGrid();
  }

  function randomize() {
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        matrices[currentTab][r][c] = Math.floor(Math.random() * 19) - 9; // -9 to 9
      }
    }
    initGrid();
  }

  function clearMat() {
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        matrices[currentTab][r][c] = "0";
      }
    }
    initGrid();
  }

  // --- MATH LOGIC ---
  function getMat(name) {
    let mat = [];
    for(let r=0; r<size; r++) {
      mat.push([]);
      for(let c=0; c<size; c++) {
        mat[r].push(parseFloat(matrices[name][r][c]) || 0);
      }
    }
    return mat;
  }

  function printMat(mat) {
    return mat.map(row => row.map(v => Number.isInteger(v) ? v : v.toFixed(3)).join('\t')).join('\n');
  }

  function showResult(title, text, isError = false) {
    const card = document.getElementById('result-card');
    card.style.display = 'block';
    card.className = isError ? 'result-card error' : 'result-card';
    document.getElementById('result-title').innerText = title;
    document.getElementById('result-text').innerText = text;
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function mockResult(title, text) {
    showResult(title, text);
  }

  function calcBinary(op) {
    let A = getMat('A');
    let B = getMat('B');
    let res = Array(size).fill().map(() => Array(size).fill(0));
    
    for(let i=0; i<size; i++) {
      for(let j=0; j<size; j++) {
        if (op === 'add') res[i][j] = A[i][j] + B[i][j];
        if (op === 'sub') res[i][j] = A[i][j] - B[i][j];
        if (op === 'mul') {
          let sum = 0;
          for(let k=0; k<size; k++) sum += A[i][k] * B[k][j];
          res[i][j] = sum;
        }
      }
    }
    showResult(op === 'add' ? 'A + B' : op === 'sub' ? 'A - B' : 'A × B', printMat(res));
  }

  function calcUnary(op) {
    let M = getMat(currentTab);
    
    if (op === 'trace') {
      let tr = 0;
      for(let i=0; i<size; i++) tr += M[i][i];
      showResult(`След Tr(${currentTab})`, `Tr = ${tr}`);
    }
    else if (op === 'trans') {
      let res = Array(size).fill().map(() => Array(size).fill(0));
      for(let i=0; i<size; i++) for(let j=0; j<size; j++) res[i][j] = M[j][i];
      showResult(`Транспонированная ${currentTab}ᵀ`, printMat(res));
    }
    else if (op === 'det') {
      // Basic det for 2x2 and 3x3 for demo
      if (size === 2) {
        let d = M[0][0]*M[1][1] - M[0][1]*M[1][0];
        showResult(`Определитель det(${currentTab})`, `det = ${d}`);
      } else if (size === 3) {
        let d = M[0][0]*(M[1][1]*M[2][2] - M[1][2]*M[2][1]) 
              - M[0][1]*(M[1][0]*M[2][2] - M[1][2]*M[2][0]) 
              + M[0][2]*(M[1][0]*M[2][1] - M[1][1]*M[2][0]);
        showResult(`Определитель det(${currentTab})`, `det = ${d}`);
      } else {
        showResult(`det(${currentTab})`, "Определитель для матриц >3x3 в веб-демо не реализован", true);
      }
    }
    else if (op === 'inv') {
       showResult(`Обратная матрица`, "Функция вычисления обратной матрицы подключена в полной версии", true);
    }
  }

  function calcScalar() {
    let k = parseFloat(document.getElementById('scalar-val').value) || 0;
    let M = getMat(currentTab);
    let res = Array(size).fill().map(() => Array(size).fill(0));
    for(let i=0; i<size; i++) for(let j=0; j<size; j++) res[i][j] = M[i][j] * k;
    showResult(`Умножение ${k} × ${currentTab}`, printMat(res));
  }

  // --- MODALS ---
  function openHistory() { document.getElementById('history-modal').classList.add('active'); }
  function closeHistory() { document.getElementById('history-modal').classList.remove('active'); }

  // Start app
  initGrid();

</script>
</body>
</html>
